---
# Source: MainChart/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: weather

---
# Source: MainChart/templates/PersistentVolume.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: weather-app-pv
  namespace: weather
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/weather

---
# Source: MainChart/templates/Service.yaml
apiVersion: v1
kind: Service
metadata:
  name: weather-app-service
  namespace: weather
  labels:
    app: weather-app
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: weather-app

---
# Source: MainChart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: weather
  labels:
    app: weather-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: weather-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
      - name: weather-app
        image: "docker.io/yourdockerhub/weather-app:latest"
        # Если pullPolicy: IfNotPresent, latest не будет обновляться. Использовать Always
        imagePullPolicy: always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DB_PATH
          value: /data/weather.db
        volumeMounts:
        - name: storage
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 100m
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: weather-app-PersistentVolumeClaim

---
# Source: MainChart/templates/autoscaling.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: weather-app-autoscaling
  namespace: weather
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: weather-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Source: MainChart/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-app-ingress
  namespace: weather
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
  - host: weather.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weather-app-service
            port:
              number: 80
