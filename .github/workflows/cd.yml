name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: temmaw/weather-app

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(date +%Y%m%d-%H%M%S)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }} ${{ env.IMAGE_NAME }}:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Update manifest repo
        env:
          MANIFEST_REPO_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          rm -rf /tmp/manifests
          git clone https://x-access-token:${MANIFEST_REPO_TOKEN}@github.com/temmaw/weather-app-manifests.git /tmp/manifests
          cd /tmp/manifests
          sed -i "s|tag:.*|tag: \"${VERSION}\"|" values-prod.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add values-prod.yaml
          git diff --staged --quiet || git commit -m "chore: update image to ${VERSION}"
          git push origin master
