name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Show environment
        run: |
          echo "Running on: $(hostname)"
          uname -a
          pwd
          ls -la
