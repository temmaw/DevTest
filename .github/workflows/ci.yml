name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Running on: $(hostname)"
          uname -a
          pwd
          ls -la

      - name: Build Docker image
        run: |
          docker build -t temmaw/weather-app:${{ github.sha }} .
          docker tag temmaw/weather-app:${{ github.sha }} temmaw/weather-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push image
        run: |
          docker push temmaw/weather-app:${{ github.sha }}
          docker push temmaw/weather-app:latest

      - name: Update manifest repo
        env:
          MANIFEST_REPO_TOKEN: ${{ secrets.MANIFEST_REPO_TOKEN }}
        run: |
          rm -rf /tmp/manifests
          git clone https://x-access-token:${MANIFEST_REPO_TOKEN}@github.com/temmaw/weather-app-manifests.git /tmp/manifests
          cd /tmp/manifests
          sed -i "s|tag:.*|tag: \"${{ github.sha }}\"|" values-prod.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add values-prod.yaml
          git diff --staged --quiet || git commit -m "chore: update image to ${{ github.sha }}"
          git push origin master
